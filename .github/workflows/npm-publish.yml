name: Npm publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example, v8.0.0)
        required: true
        type: string

jobs:
  publish:
    if: >-
      (github.event_name == 'release' && github.event.release.prerelease == false) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    concurrency:
      group: npm-publish-qiniu
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Select stable release tag
        id: release
        shell: bash
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag such as v8.0.0." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify package identity
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          node <<'NODE'
          const { name, version } = require('./package.json')
          if (name !== 'qiniu' || `v${version}` !== process.env.TAG) {
            console.error(`Expected qiniu at ${process.env.TAG}, found ${name}@${version}.`)
            process.exitCode = 1
          }
          NODE
      - name: Install npm CLI
        env:
          NPM_VERSION: '11.16.0'
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          installed_version="$(npm --version)"
          if [[ "$installed_version" != "$NPM_VERSION" ]]; then
            echo "::error::Expected npm $NPM_VERSION, found $installed_version."
            exit 1
          fi
      - run: npm pack --dry-run --ignore-scripts
      - name: Check npm registry versions
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          metadata="$(npm view qiniu dist-tags versions --json --prefer-online --registry=https://registry.npmjs.org)"
          NPM_METADATA="$metadata" node <<'NODE'
          const { 'dist-tags': tags, versions } = JSON.parse(process.env.NPM_METADATA)
          if (!Array.isArray(versions)) {
            throw new Error('Expected a version list for qiniu on npm.')
          }
          const version = process.env.TAG.slice(1)
          if (versions.includes(version)) {
            throw new Error(`qiniu@${version} is already published on npm. npm versions cannot be overwritten.`)
          }
          const latest = tags?.latest
          if (typeof latest !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(latest)) {
            throw new Error('Expected a stable version for npm latest.')
          }
          const candidate = version.split('.').map(BigInt)
          const current = latest.split('.').map(BigInt)
          const difference = candidate.findIndex((part, index) => part !== current[index])
          if (difference !== -1 && candidate[difference] < current[difference]) {
            throw new Error(`Refusing to move npm latest from ${latest} back to ${version}.`)
          }
          NODE
      - name: Publish to npm
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          provenance_args=()
          # npm uses the event ref and SHA for automatic provenance.
          if [[ "$GITHUB_REF" != "refs/tags/$TAG" || "$GITHUB_SHA" != "$checkout_sha" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
              echo "::error::The checked-out tag does not match the Release event ref and commit."
              exit 1
            fi
            echo "::warning::Publishing without npm provenance because the dispatch ref and commit differ from the release tag."
            provenance_args+=(--provenance=false)
          fi
          npm publish --access public --tag latest --ignore-scripts "${provenance_args[@]}"
